name: Build Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect newest mobile source ZIP
        shell: bash
        run: |
          shopt -s nullglob
          files=(DONG_Mobile_v*.zip)
          if (( ${#files[@]} == 0 )); then
            echo "No DONG_Mobile_v*.zip source archive found in the repository root."
            exit 1
          fi

          SOURCE_ZIP="$(printf '%s\n' "${files[@]}" | sort -V | tail -n 1)"
          SOURCE_DIR="${SOURCE_ZIP%.zip}"
          VERSION="${SOURCE_DIR#DONG_Mobile_}"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=DONG-Mobile-${VERSION}-debug-apk" >> "$GITHUB_ENV"
          echo "Building newest source: $SOURCE_ZIP"

      - name: Verify mobile source ZIP
        run: unzip -t "$SOURCE_ZIP"

      - name: Unpack mobile source
        run: unzip -q -o "$SOURCE_ZIP"

      - name: Show Android build configuration
        run: |
          echo "--- $SOURCE_DIR/buildozer.spec ---"
          cat "$SOURCE_DIR/buildozer.spec"
          echo "--------------------------------"

      - name: Pull official Buildozer image
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: Build APK with official Buildozer container
        run: |
          docker run --rm \
            --volume "$PWD/$SOURCE_DIR:/home/user/hostcwd" \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: List APK output
        if: always()
        run: find "$SOURCE_DIR/bin" -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SOURCE_DIR }}/bin/*.apk
          if-no-files-found: error
