name: Build Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify mobile source ZIP
        run: |
          test -f DONG_Mobile_v0_1.zip || (echo "DONG_Mobile_v0_1.zip is missing from the repository root." && exit 1)
          unzip -t DONG_Mobile_v0_1.zip

      - name: Unpack mobile source
        run: unzip -q -o DONG_Mobile_v0_1.zip

      - name: Show Android build configuration
        run: |
          echo "--- buildozer.spec ---"
          cat DONG_Mobile_v0_1/buildozer.spec
          echo "----------------------"

      - name: Build APK with Buildozer
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer -v android debug
          repository_root: .
          workdir: DONG_Mobile_v0_1
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DONG-Mobile-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
