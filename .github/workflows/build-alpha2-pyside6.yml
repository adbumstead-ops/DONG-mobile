name: Build DONG Mobile Alpha 2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install native Android build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            patch \
            pkg-config \
            python3-dev \
            unzip \
            wget \
            zip

      - name: Install host Qt for Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6==6.12.0'
          ANDROID_REQS="$(python - <<'PY'
          from pathlib import Path
          import PySide6
          print(Path(PySide6.__file__).resolve().parent / 'scripts' / 'requirements-android.txt')
          PY
          )"
          echo "Installing Qt Android deploy requirements from $ANDROID_REQS"
          python -m pip install -r "$ANDROID_REQS"

      - name: Verify and unpack Alpha 2 source
        run: |
          test -f Dong_Mobile_v0_17_14_a2.zip
          unzip -t Dong_Mobile_v0_17_14_a2.zip
          rm -rf android-src
          mkdir android-src
          unzip -q Dong_Mobile_v0_17_14_a2.zip -d android-src
          test -f android-src/Dong_Mobile_v0_17_14_a2/main.py

      - name: Download official PySide6 Android ARM64 wheels
        run: |
          mkdir -p android-wheels
          curl -fL --retry 4 --retry-delay 3 \
            -o android-wheels/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl \
            https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl
          curl -fL --retry 4 --retry-delay 3 \
            -o android-wheels/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl \
            https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl
          ls -lh android-wheels

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Add Buildozer SDK compatibility paths
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sfn "$(command -v sdkmanager)" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          if command -v avdmanager >/dev/null 2>&1; then
            ln -sfn "$(command -v avdmanager)" "$ANDROID_SDK_ROOT/tools/bin/avdmanager"
          fi
          ls -l "$ANDROID_SDK_ROOT/tools/bin"

      - name: Install required Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358'
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"

      - name: Build ARM64 debug APK with Qt for Python
        id: qt_build
        working-directory: android-src/Dong_Mobile_v0_17_14_a2
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        shell: bash
        run: |
          set -o pipefail
          pyside6-android-deploy \
            --name 'DONGMobile' \
            --wheel-pyside="$GITHUB_WORKSPACE/android-wheels/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl" \
            --wheel-shiboken="$GITHUB_WORKSPACE/android-wheels/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl" \
            --ndk-path="$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            --sdk-path="$ANDROID_SDK_ROOT" \
            --keep-deployment-files \
            --force \
            --verbose 2>&1 | tee "$GITHUB_WORKSPACE/pyside-android-deploy.log"

      - name: Inspect Android deployment output
        if: always()
        shell: bash
        run: |
          echo '=== APK/AAB files anywhere in workspace ==='
          find "$GITHUB_WORKSPACE" -type f \( -name '*.apk' -o -name '*.aab' \) -print || true
          echo '=== Deployment/build directories ==='
          find "$GITHUB_WORKSPACE/android-src" -type d \( -name deployment -o -name .buildozer -o -name bin -o -name build \) -print 2>/dev/null | head -n 200 || true
          echo '=== Build specs and logs ==='
          find "$GITHUB_WORKSPACE/android-src" -type f \( -name 'buildozer.spec' -o -name 'pysidedeploy.spec' -o -name '*.log' \) -print 2>/dev/null | head -n 300 || true
          echo '=== Generated project tree (selected depth) ==='
          find "$GITHUB_WORKSPACE/android-src/Dong_Mobile_v0_17_14_a2" -maxdepth 4 -type f -print 2>/dev/null | sort | head -n 500 || true

      - name: Retry generated Buildozer project directly if APK is missing
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print -quit | grep -q .; then
            echo 'APK already exists; direct Buildozer retry is not needed.'
            exit 0
          fi

          SPEC="$(find "$GITHUB_WORKSPACE/android-src/Dong_Mobile_v0_17_14_a2" -type f -name 'buildozer.spec' -print -quit 2>/dev/null || true)"
          if [ -z "$SPEC" ]; then
            echo 'No generated buildozer.spec was found. See diagnostics artifact for Qt deploy output.'
            exit 0
          fi

          SPEC_DIR="$(dirname "$SPEC")"
          echo "Retrying Buildozer directly from: $SPEC_DIR"
          cd "$SPEC_DIR"
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/buildozer-direct.log" || true

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          echo 'APK files found across entire workspace:'
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print || true
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          APK="$(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo 'ERROR: No APK was produced.'
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/DONG_Mobile_v0_17_14_a2-arm64-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DONG-Mobile-v0.17.14-a2-APK
          path: apk-output/DONG_Mobile_v0_17_14_a2-arm64-debug.apk
          if-no-files-found: warn
          compression-level: 0

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DONG-Mobile-Android-build-diagnostics
          path: |
            pyside-android-deploy.log
            buildozer-direct.log
            android-src/Dong_Mobile_v0_17_14_a2/pysidedeploy.spec
            android-src/Dong_Mobile_v0_17_14_a2/**/buildozer.spec
          if-no-files-found: warn
          retention-days: 7
