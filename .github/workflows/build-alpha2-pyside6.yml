name: Build DONG Mobile Alpha 2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install host Qt for Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6==6.12.0'

      - name: Verify and unpack Alpha 2 source
        run: |
          test -f Dong_Mobile_v0_17_14_a2.zip
          unzip -t Dong_Mobile_v0_17_14_a2.zip
          rm -rf android-src
          mkdir android-src
          unzip -q Dong_Mobile_v0_17_14_a2.zip -d android-src
          test -f android-src/Dong_Mobile_v0_17_14_a2/main.py

      - name: Download official PySide6 Android ARM64 wheels
        run: |
          mkdir -p android-wheels
          curl -fL --retry 4 --retry-delay 3 \
            -o android-wheels/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl \
            https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl
          curl -fL --retry 4 --retry-delay 3 \
            -o android-wheels/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl \
            https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl
          ls -lh android-wheels

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install required Android SDK and NDK
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358'
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"

      - name: Build ARM64 debug APK with Qt for Python
        working-directory: android-src/Dong_Mobile_v0_17_14_a2
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          pyside6-android-deploy \
            --name 'DONG Mobile' \
            --wheel-pyside="$GITHUB_WORKSPACE/android-wheels/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl" \
            --wheel-shiboken="$GITHUB_WORKSPACE/android-wheels/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl" \
            --ndk-path="$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            --sdk-path="$ANDROID_SDK_ROOT" \
            --keep-deployment-files \
            --force \
            --verbose

      - name: Collect APK
        if: always()
        run: |
          echo 'APK files found:'
          find android-src -type f -name '*.apk' -print || true
          mkdir -p apk-output
          APK="$(find android-src -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" apk-output/DONG_Mobile_v0_17_14_a2-arm64-debug.apk
          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DONG-Mobile-v0.17.14-a2-APK
          path: apk-output/DONG_Mobile_v0_17_14_a2-arm64-debug.apk
          if-no-files-found: error
          compression-level: 0
